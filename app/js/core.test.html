<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>core.js tests</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  body { padding: var(--s-4); }
  .pass { color: var(--teal); }
  .fail { color: red; font-weight: 700; }
  #out { font-family: var(--font-mono); font-size: var(--fs-meta); white-space: pre-wrap; }
</style>
<script>
  /* page is at /app/js/, so point config at the real folders */
  window.APP_CONFIG = { repoBase: '../../', stringsBase: '../strings/', manifestUrl: 'about:blank-never-fetched' };
</script>
<script src="core.js"></script>
</head>
<body>
<h1>core.js tests</h1>
<p id="summary">Running...</p>
<div id="out"></div>
<script>
(function () {
  var pass = 0, fail = 0, out = document.getElementById('out');
  function ok(cond, name) {
    if (cond) pass++; else fail++;
    var d = document.createElement('div');
    d.className = cond ? 'pass' : 'fail';
    d.textContent = (cond ? 'PASS ' : 'FAIL ') + name;
    out.appendChild(d);
  }
  function eq(a, b, name) { ok(JSON.stringify(a) === JSON.stringify(b), name + (JSON.stringify(a) === JSON.stringify(b) ? '' : '  got ' + JSON.stringify(a) + ' want ' + JSON.stringify(b))); }

  var FIXTURE = {
    schema_version: 2, generated_utc: '2026-01-10T06:00:00Z',
    app: { default_region: 'r_all', default_lang: 'en' },
    regions: [
      { id: 'r_all', name: 'All', default: true, children: ['r_a'] },
      { id: 'r_a', name: 'A', parent: 'r_all', districts: ['X'] },
      { id: 'r_b', name: 'B' }
    ],
    sources: [{ id: 's1', provider: 'P', credit_line: 'Credit one' }],
    layers: [
      { id: 'opt1', type: 'optical', chip: 'context', name: 'Optical', date: '2026-01-09', regions: ['r_all'], default_on: false, status: 'ready' },
      { id: 'nis_old', type: 'nisar', chip: 'nisar', name: 'NISAR old', date: '2026-01-01', latest_of: 'nis_series', regions: ['r_all'], status: 'ready', source_id: 's1' },
      { id: 'nis_new', type: 'nisar', chip: 'nisar', name: 'NISAR new', date: '2026-01-05', latest_of: 'nis_series', regions: ['r_all'], default_on: true, status: 'ready', source_id: 's1', opacity: 0.7 },
      { id: 'nis_na', type: 'nisar', chip: 'nisar', name: 'NISAR unavailable', date: '2026-01-08', latest_of: 'nis_series', regions: ['r_all'], status: 'unavailable' },
      { id: 'only_b', type: 'reference', chip: 'reference', name: 'Only B', regions: ['r_b'], status: 'ready' },
      { id: 'ev_layer', type: 'derived', chip: 'nisar', name: 'Event layer', event_id: 'ev1', regions: ['r_all'], default_on: true, status: 'ready' },
      { id: 'ev_layer2', type: 'nisar', chip: 'nisar', name: 'Event NISAR', event_id: 'ev1', date: '2026-01-09', regions: ['r_all'], status: 'ready' },
      { id: 'weather1', type: 'weather', chip: 'model', name: 'Weather', status: 'ready', default_on: true },
      { id: 'weird', type: 'optical', chip: 'context', name: 'Weird', status: 'bogus_status' }
    ],
    events: [{
      id: 'ev1', name: 'Test event', region: 'r_a',
      dates: { before: '2026-01-02', during: '2026-01-04', after: '2026-01-06', normal_period: ['2025-12-20', '2026-01-02'] },
      default_on: ['ev_layer2', 'nis_new', 'does_not_exist'],
      landfall: { lat: 1, lon: 2, time_utc: null }
    }],
    analyses: []
  };
  var V1 = {
    layers: [
      { id: 'a', group: 'before', name: 'A', chip: 'nisar', default_on: true, png: 'p.png', bounds: [[0, 0], [1, 1]] },
      { id: 'b', group: 'next', name: 'B', chip: 'context' },
      { id: 'c', group: 'after', name: 'C', chip: 'model', default_on: true }
    ]
  };

  async function run() {
    // ---- strings ----
    await App.loadStrings('en');
    ok(App.hasString('header.tab.events'), 'strings.en.json loads (header.tab.events present)');
    eq(App.t('ranking.subtitle', { date: '9 Nov', days: 12 }), 'Share of each mandal, 9 Nov (NISAR, 12 days after)', 't() interpolates {vars}');
    eq(App.t('alerts.snapshot', { time: 'T' }), 'snapshot T', 't() interpolates single var');
    eq(App.t('layers.count'), '{n} on', 't() leaves unknown {var} untouched when vars omitted');
    var warned = 0, origWarn = console.warn;
    console.warn = function () { warned++; };
    eq(App.t('no.such.key'), '⟨no.such.key⟩', 't() missing key returns marker');
    console.warn = origWarn;
    ok(warned === 1, 't() missing key calls console.warn');
    // fallback lang -> en
    App.addStrings('te', { 'common.close': 'TE-close' });
    App.state.lang = 'te';
    eq(App.t('common.close'), 'TE-close', 'te string used when present');
    eq(App.t('common.loading'), 'Loading', 'te falls back to en when key missing');
    App.state.lang = 'en';

    // ---- fetchJSON ----
    var threw = false, r;
    try { r = await App.fetchJSON('/definitely/not/here.json', { fallbackLabel: 'x' }); } catch (e) { threw = true; }
    ok(!threw, 'fetchJSON does not throw on 404');
    ok(r && r.ok === false && r.data === null && typeof r.error === 'string', 'fetchJSON 404 returns ok:false with error');
    ok(r && r.fallbackLabel === 'x', 'fetchJSON passes fallbackLabel through');
    try { r = await App.fetchJSON('http://127.0.0.1:1/nope.json', { timeoutMs: 500 }); } catch (e) { threw = true; }
    ok(!threw && r.ok === false, 'fetchJSON network failure returns ok:false');
    // lastKnown: seed a success, then fail
    var goodUrl = '../strings/strings.en.json';
    var g = await App.fetchJSON(goodUrl);
    ok(g.ok && g.fetchedAt && g.data['common.close'], 'fetchJSON success returns data and fetchedAt');
    ok(App.lastKnown(goodUrl) === g.fetchedAt, 'lastKnown records the success time');
    // simulate the same url failing later by faking fetch
    var realFetch = window.fetch;
    window.fetch = function () { return Promise.reject(new TypeError('offline')); };
    var f = await App.fetchJSON(goodUrl);
    window.fetch = realFetch;
    ok(f.ok === false && f.lastKnown === g.fetchedAt, 'failed fetch exposes last known success time');
    // timeout
    window.fetch = function (u, o) {
      return new Promise(function (res, rej) { o.signal.addEventListener('abort', function () { var e = new Error('aborted'); e.name = 'AbortError'; rej(e); }); });
    };
    var t0 = Date.now();
    var to = await App.fetchJSON('/slow.json', { timeoutMs: 200 });
    window.fetch = realFetch;
    ok(to.ok === false && /timeout/.test(to.error) && Date.now() - t0 < 2000, 'fetchJSON aborts after timeoutMs');
    // unparsable json
    window.fetch = function () { return Promise.resolve({ ok: true, json: function () { return Promise.reject(new SyntaxError('bad json')); } }); };
    var bad = await App.fetchJSON('/bad.json');
    window.fetch = realFetch;
    ok(bad.ok === false, 'fetchJSON invalid JSON returns ok:false');
    // localStorage throwing must not break
    var origLS = Object.getOwnPropertyDescriptor(window, 'localStorage');
    try {
      Object.defineProperty(window, 'localStorage', { configurable: true, get: function () { throw new Error('blocked'); } });
      var g2 = await App.fetchJSON(goodUrl + '?x=1');
      ok(g2.ok && App.lastKnown(goodUrl + '?x=1') === g2.fetchedAt, 'works with localStorage blocked (in-memory fallback)');
    } catch (e) { ok(false, 'localStorage blocked test threw ' + e); }
    if (origLS) Object.defineProperty(window, 'localStorage', origLS);

    // ---- manifest + state ----
    var events = [];
    ['state', 'region', 'event', 'layers', 'mandal', 'compare', 'view', 'manifest'].forEach(function (n) { App.on(n, function () { events.push(n); }); });
    App.setManifest(FIXTURE);
    ok(events.indexOf('manifest') >= 0, "'manifest' event emitted");
    eq(App.state.region, 'r_all', 'default region applied');
    eq(Array.from(App.state.layersOn).sort(), ['nis_new', 'weather1'], 'landing layersOn = ready default_on layers, no event layers');
    eq(App.state.opacity.nis_new, 0.7, 'landing opacity from layer.opacity');
    eq(App.layerById('weird').status, 'unavailable', 'unknown status treated as unavailable');
    eq(App.layerById('nis_new').credit, 'Credit one', 'layer credit filled from source credit_line');

    // ---- latestFor ----
    eq(App.latestFor('nis_series').id, 'nis_new', 'latestFor picks newest READY layer of a series');
    eq(App.latestFor('opt1').id, 'opt1', 'latestFor falls back to layer id');
    eq(App.latestFor('nothing'), null, 'latestFor unknown -> null');

    // ---- layersFor ----
    var ids = function (q) { return App.layersFor(q).map(function (l) { return l.id; }); };
    var landing = ids({ region: 'r_all', eventId: null });
    ok(landing.indexOf('ev_layer') < 0 && landing.indexOf('ev_layer2') < 0, 'event layers hidden when no event loaded');
    ok(landing.indexOf('only_b') < 0, 'layer.regions filter excludes other region');
    ok(landing.indexOf('weather1') >= 0, 'layer without regions offered everywhere');
    eq(landing.slice(0, 2), ['nis_na', 'nis_new'], 'NISAR type first, newest first within type');
    eq(App.layersFor({ region: 'r_all' })[App.layersFor({ region: 'r_all' }).length - 1].type !== 'nisar', true, 'non-NISAR after NISAR');
    var withEv = ids({ region: 'r_a', eventId: 'ev1' });
    ok(withEv.indexOf('ev_layer') >= 0 && withEv.indexOf('ev_layer2') >= 0, 'event layers listed when that event is loaded (child region inherits parent layers)');
    eq(withEv[0], 'ev_layer2', 'NISAR event layer ranks first (newest NISAR)');
    ok(ids({ region: 'r_a', eventId: 'other' }).indexOf('ev_layer') < 0, 'event layers hidden for a different event');
    ok(ids({ region: 'r_b', eventId: null }).indexOf('only_b') >= 0, 'region-specific layer shown in its region');
    ok(ids({ region: 'r_b', eventId: null }).indexOf('nis_new') < 0, 'region r_b excludes r_all-only layers');

    // ---- likely ----
    eq(App.likely('new open water'), 'likely new open water', 'likely() prefixes');
    eq(App.likely('New open water'), 'likely new open water', 'likely() lowercases first letter');
    eq(App.likely('likely wet crops'), 'likely wet crops', 'likely() no double prefix');
    eq(App.likely('Likely wet crops'), 'likely wet crops', 'likely() normalises existing prefix');
    eq(App.likely('NISAR change'), 'likely NISAR change', 'likely() keeps acronyms');

    // ---- state bus ----
    events.length = 0;
    App.setState({ mandal: 'M1' });
    ok(events.indexOf('state') >= 0 && events.indexOf('mandal') >= 0, "setState emits 'state' and 'mandal'");
    events.length = 0;
    App.setState({ mandal: 'M1' });
    eq(events, [], 'setState with no change emits nothing');
    events.length = 0;
    App.setState({ compare: { on: true, a: 'x' } });
    ok(events.indexOf('compare') >= 0 && App.state.compare.on === true && App.state.compare.b === null, "compare merged and 'compare' emitted");
    events.length = 0;
    App.setState({ view: 'events' });
    ok(events.indexOf('view') >= 0, "'view' emitted");
    App.setState({ view: 'workspace', compare: { on: false } });
    var h = function () { throw new Error('boom'); }; var errs = 0, oe = console.error;
    console.error = function () { errs++; };
    App.on('mandal', h); App.setState({ mandal: 'M2' }); App.off('mandal', h);
    console.error = oe;
    ok(errs === 1 && App.state.mandal === 'M2', 'throwing handler does not break the bus');
    events.length = 0; App.setState({ mandal: 'M3' });
    ok(true, 'off() removed handler');

    // ---- applyEvent / clearEvent ----
    events.length = 0;
    ok(App.applyEvent('ev1') === true, 'applyEvent returns true');
    eq(App.state.eventId, 'ev1', 'applyEvent sets eventId');
    eq(App.state.region, 'r_a', 'applyEvent sets event region');
    eq(App.state.date, '2026-01-06', 'applyEvent sets date to the after date');
    eq(App.state.range, ['2026-01-02', '2026-01-06'], 'applyEvent sets range [before, after]');
    eq(Array.from(App.state.layersOn), ['ev_layer2', 'nis_new'], 'applyEvent layersOn = event.default_on (unknown ids dropped)');
    eq(App.state.mandal, null, 'applyEvent clears mandal');
    ok(events.indexOf('event') >= 0 && events.indexOf('region') >= 0 && events.indexOf('layers') >= 0, 'applyEvent emits event/region/layers');
    ok(App.applyEvent('missing') === false, 'applyEvent unknown id returns false');
    App.clearEvent();
    eq(App.state.eventId, null, 'clearEvent clears eventId');
    eq(App.state.region, 'r_all', 'clearEvent restores default region');
    eq(App.state.date, null, 'clearEvent date = latest');
    eq(Array.from(App.state.layersOn).sort(), ['nis_new', 'weather1'], 'clearEvent restores landing layers');
    // event without default_on falls back to event layers default_on
    var F2 = JSON.parse(JSON.stringify(FIXTURE)); delete F2.events[0].default_on;
    App.setManifest(F2); App.applyEvent('ev1');
    ok(App.state.layersOn.has('ev_layer'), 'applyEvent without default_on uses ready default_on layers of the event');

    // ---- v1 tolerance ----
    App.setManifest(V1);
    eq(App.manifest.schema_version, 1, 'v1 manifest keeps schema_version 1');
    eq(App.regionById(App.state.region) && App.regionById(App.state.region).default, true, 'v1: a default region is synthesised');
    eq(App.layerById('a').type, 'nisar', 'v1: chip nisar -> type nisar');
    eq(App.layerById('c').type, 'weather', 'v1: chip model -> type weather');
    eq(App.layerById('b').type, 'optical', 'v1: chip context -> type optical');
    eq(App.layerById('b').status, 'coming_next', 'v1: group next -> status coming_next');
    eq(App.layerById('a').status, 'ready', 'v1: status defaults to ready');
    eq(Array.from(App.state.layersOn).sort(), ['a', 'c'], 'v1: landing layers from default_on');
    eq(App.layersFor({ region: App.state.region }).map(function (l) { return l.id; })[0], 'a', 'v1: NISAR first in layersFor');
    ok(Array.isArray(App.manifest.events) && Array.isArray(App.manifest.coming_next), 'v1: missing arrays defaulted');
    App.setManifest({});
    ok(App.manifest.layers.length === 0 && !!App.state.region, 'empty manifest {} still installs defaults');

    // ---- formatters ----
    eq(App.fmt.date('2026-11-09'), '9 Nov 2026', 'fmt.date');
    eq(App.fmt.date('2026-11-09', { year: false }), '9 Nov', 'fmt.date without year');
    eq(App.fmt.dateTime('2026-10-27T13:01:00Z'), '27 Oct 2026, 18:31 IST', 'fmt.dateTime IST');
    eq(App.fmt.dateTime('2026-10-27T13:01:00Z', 'UTC'), '27 Oct 2026, 13:01 UTC', 'fmt.dateTime UTC');
    eq(App.fmt.ageDays('2026-11-04', '2026-11-09'), 5, 'fmt.ageDays');
    eq(App.fmt.ageDays('2026-11-09', '2026-11-04'), 0, 'fmt.ageDays never negative');
    eq(App.fmt.pct(12.4), '12%', 'fmt.pct');
    eq(App.fmt.pm(3.2), '±3', 'fmt.pm');
    eq(App.fmt.date(null), '', 'fmt.date(null) empty');

    // ---- shell strings genericity ----
    var all = (await App.fetchJSON('../strings/strings.en.json')).data;
    var bad2 = Object.keys(all).filter(function (k) { return !/^case\./.test(k) && /arnab|narsapur/i.test(k + ' ' + all[k]); });
    eq(bad2, [], 'no Arnab/Narsapur in non-case string keys or values');

    document.getElementById('summary').innerHTML = 'PASS: ' + pass + ' &nbsp; FAIL: ' + fail;
    document.getElementById('summary').className = fail ? 'fail' : 'pass';
    document.title = (fail ? 'FAIL ' : 'PASS ') + pass + '/' + (pass + fail);
    window.__testResult = { pass: pass, fail: fail };
  }
  run().catch(function (e) { ok(false, 'test runner crashed: ' + e + '\n' + (e && e.stack)); document.getElementById('summary').textContent = 'CRASHED'; window.__testResult = { pass: pass, fail: fail + 1 }; });
})();
</script>
</body>
</html>
