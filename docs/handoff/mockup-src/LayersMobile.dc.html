<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eye of the Storm · phone layers sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,400..700&family=Anek+Telugu:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17635F}a:hover{color:#0E4542}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #0F1B1F; color: #131E22; font-family: 'Anek Latin', system-ui, sans-serif">
  <img src="/_blob/8b144236201a282bc430fe768747ab24" alt="" style="position: absolute; width: 700px; left: calc(55% - 287px); top: 60px">
  <div style="position: absolute; inset: 0; background: rgba(19,30,34,0.35)"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 52px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #D3DAD8; display: flex; align-items: center; gap: 8px; padding: 0 14px">
    <span style="font-size: 16px; font-weight: 600; font-stretch: 88%; letter-spacing: -0.01em">Eye of the Storm</span>
  </div>

  <section aria-label="Layers" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: #FFFFFF; border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 4px; border-radius: 2px; background: #D3DAD8"></span></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 2px 8px 6px 16px">
      <div style="display: flex; flex-direction: column; flex: 1">
        <h2 style="margin: 0; font-size: 20px; line-height: 1.2; font-weight: 600; font-stretch: 88%; letter-spacing: -0.01em">Layers</h2>
        <span style="font-size: 13px; color: #586469">Read from manifest.json</span>
      </div>
      <button aria-label="Close layers" style="width: 44px; height: 44px; border: 0; background: transparent; font-size: 22px; color: #131E22">×</button>
    </div>
    <div style="display: flex; gap: 6px; padding: 0 16px 8px; font-size: 13px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #E6EBEA">
      <span style="font-size: 12px; padding: 2px 7px; border-radius: 6px; background: #D8EAE7; color: #0E4542; font-weight: 600">NISAR L-band</span><span style="color: #586469">radar, the core</span>
      <span style="font-size: 12px; padding: 2px 7px; border-radius: 6px; background: #E6EBEA; color: #3F4D53; margin-left: 6px">Context</span><span style="color: #586469">other sources</span>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 0 16px 16px">
      <div style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: baseline; gap: 8px; padding: 12px 0 2px">
          <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.05em">ON NOW</span>
          <span style="font-size: 12px; color: #586469; font-family: 'IBM Plex Mono', monospace">3 layers</span>
        </div>
        <sc-for list="{{onNow}}" as="l" hint-placeholder-count="3">
          <label style="display: flex; gap: 10px; padding: 10px 0; min-height: 44px; border-top: 1px solid #E6EBEA; cursor: pointer">
            <input type="checkbox" checked="{{l.on}}" style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #131E22; flex: none">
            <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1">
              <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span style="font-size: 14px; font-weight: 500">{{l.name}}</span><span style="{{l.chipStyle}}">{{l.chip}}</span></span>
              <span style="font-size: 13px; color: #3F4D53"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{l.date}}</span> · {{l.source}}</span>
              <span style="display: flex; gap: 6px; font-size: 13px; color: #3F4D53"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#586469" stroke-width="2" aria-hidden="true" style="flex: none; margin-top: 3px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg><span><span style="font-weight: 600; color: #131E22">Can't show:</span> {{l.limit}}</span></span>
            </span>
          </label>
        </sc-for>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column">
          <div style="display: flex; align-items: baseline; gap: 8px; padding: 12px 0 2px">
            <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.05em">{{g.title}}</span>
            <span style="font-size: 12px; color: #586469; font-family: 'IBM Plex Mono', monospace">{{g.range}}</span>
          </div>
          <sc-for list="{{g.items}}" as="l" hint-placeholder-count="3">
            <div style="border-top: 1px solid #E6EBEA">
              <div style="display: flex; align-items: center; gap: 2px; min-height: 44px">
                <label style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; min-height: 44px; cursor: pointer">
                  <input type="checkbox" checked="{{l.on}}" style="width: 20px; height: 20px; margin: 0; accent-color: #131E22; flex: none">
                  <span style="display: flex; align-items: center; gap: 2px 6px; flex-wrap: wrap; min-width: 0">
                    <span style="font-size: 14px; font-weight: 500">{{l.name}}</span>
                    <span style="{{l.chipStyle}}">{{l.chip}}</span>
                  </span>
                </label>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3F4D53; white-space: nowrap">{{l.date}}</span>
                <button aria-label="Details" aria-expanded="{{l.open}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #3F4D53; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="{{l.chevStyle}}"><path d="M6 9l6 6 6-6"></path></svg></button>
              </div>
              <sc-if value="{{l.open}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 0 12px 30px; font-size: 13px; color: #3F4D53">
                  <span>{{l.source}}</span>
                  <span style="display: flex; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#586469" stroke-width="2" aria-hidden="true" style="flex: none; margin-top: 3px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg><span><span style="font-weight: 600; color: #131E22">Can't show:</span> {{l.limit}}</span></span>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 0 4px; margin-top: 8px; border-top: 1px solid #E6EBEA">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.05em">COMING NEXT</span>
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{soon}}" as="s" hint-placeholder-count="3">
            <span aria-disabled="true" style="font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #E6EBEA; color: #586469">{{s.name}}</span>
          </sc-for>
        </div>
        <span style="font-size: 13px; color: #586469">not built for this event</span>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var N = 'background:#D8EAE7;color:#0E4542;font-weight:600;';
    var C = 'background:#E6EBEA;color:#3F4D53;';
    function L(name, chip, nisar, date, source, limit, on, open) {
      return {
        name: name, chip: chip, date: date, source: source, limit: limit, on: !!on, open: !!open,
        chipStyle: 'font-size:12px;padding:2px 7px;border-radius:6px;' + (nisar ? N : C),
        chevStyle: 'transform:rotate(' + (open ? 180 : 0) + 'deg)'
      };
    }
    var onNow = [
      L('Mandal boundaries', 'Reference', 0, '[year]', '[boundary source] · [licence]', 'administrative lines, not flood extents', 1),
      L('Sea surface, eye pass', 'NISAR L-band', 1, '27 Oct 13:01 UTC', 'T48 F80 urgent response · NASA/ISRO', 'wind speed; brightness shows roughness', 1),
      L('IMD cyclone track', 'IMD', 0, '3-hourly fixes', 'IMD bulletins · credited link', 'the exact path between fixes (interpolated)', 1)
    ];
    var groups = [
      { title: 'BEFORE', range: '3–23 Oct', items: [
        L('Calm sea reference', 'NISAR L-band', 1, '15 Oct', 'T48 F80 · NASA/ISRO via ASF', 'an average sea (one calm day only)'),
        L('Coast before the storm', 'NISAR L-band', 1, '23 Oct', 'T156 F10 · NASA/ISRO via ASF', 'wet soil apart from shallow water')
      ]},
      { title: 'DURING', range: '27–28 Oct', items: [
        L('Cloud image', 'Optical', 0, '27 Oct', 'NASA GIBS · VIIRS', 'the sea or land (cloud tops only)'),
        L('Wind model', 'Model · live', 0, 'live', 'Open-Meteo', 'measured wind (a forecast model)')
      ]},
      { title: 'AFTER', range: '28 Oct – 4 Nov', items: [
        L('Coast, 4 hours after landfall', 'NISAR L-band', 1, '28 Oct', 'T55 F10 urgent response', 'whether water is still rising (one look)'),
        L('Coast, 7 days after', 'NISAR L-band', 1, '4 Nov', 'T156 F10 · NASA/ISRO via ASF', 'ground truth (single date, none yet)'),
        L('Likely flooded (classes)', 'NISAR derived', 1, '23 Oct → 4 Nov', 'SpaceBros change map', 'water under dense crops (it can be missed)', 0, 1),
        L('Mandal ranking', 'NISAR derived', 1, '4 Nov', 'SpaceBros · mandal_rank.json', 'damage (it ranks likely flooded share)')
      ]}
    ];
    return {
      onNow: onNow,
      groups: groups,
      soon: [{ name: 'Earthquake and landslide' }, { name: 'Oil spill' }, { name: 'Wildfire' }]
    };
  }
}
</script>
</body>
</html>
